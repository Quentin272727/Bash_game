<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../style.css">
    <title>Jeux BASH linux</title>
</head>
<body>
    <div class="bandeau"> <h1>Pierre Papier Ciseaux</h1> </div>

    <div class="buttons">
        <button onclick = "play('🗿')">🗿</button>
        <button onclick = "play('📄')">📄</button>
        <button onclick = "play('✂️')">✂️</button>
    </div>

    <div class="rules">
        <p>Règles du jeu :<br>
        - 🗿 bat ✂️<br>
        - ✂️ bat 📄<br>
        - 📄 bat 🗿</p>
    </div>

    <div class = "result">
        <p id="result"></p>
    </div>
    
    <div class="fight">
        <div id="fight">
            <span id="player-icon">🗿</span>
            <span id="versus">VS</span>
            <span id="computer-icon">❓</span>
        </div>
    </div>

<p id="result"></p>

<footer class="footer">
    <div id="contribution">
        <p>contribution :</p>
        <a href="https://github.com/Corrailius">Jean–Daudé Louka</a><br>
        <a href="https://github.com/evann-g">Guilhem Evann</a><br>
        <a href="https://github.com/Quentin272727">Mateus Quentin</a><br>
        <a href="https://github.com/sansationnelle">Luigi Cabezas</a>
    </div>
    <a class="repo-link" href="https://github.com/Quentin272727/Uno_Games_project">Repository</a>
</footer>
<script>
    async function play(playerChoice) {
        const response = await fetch('play.sh', {
            method: 'POST',
            body: playerChoice
        });
        const text = await response.text();
        const data = JSON.parse(text);

        // Update the VS display
        document.getElementById('player-icon').textContent = playerChoice;
        document.getElementById('player-icon').style.opacity = '1';
        document.getElementById('computer-icon').textContent = data.computerChoice;
        document.getElementById('computer-icon').style.opacity = '1';

        // Result message
        const msg = data.result === 'tie' ? "Égalité !" : data.result === 'win' ? '✔️ Vous gagnez !' : '❌ Vous perdez !';
        document.getElementById('result').textContent = msg;
    }
</script>
</body>
</html>
