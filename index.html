<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jeux BASH linux</title>
</head>
<body>
    <div class="bandeau"> <h1>Pierre Papier Ciseaux</h1> </div>

    <div class="buttons">
        <button onclick = "play('🗿')">🗿</button>
        <button onclick = "play('📄')">📄</button>
        <button onclick = "play('✂️')">✂️</button>
    </div>

    <div class="rules">
        <p>Règles du jeu :<br>
        - 🗿 bat ✂️<br>
        - ✂️ bat 📄<br>
        - 📄 bat 🗿</p>
    </div>

    <div class = "result">
        <p id="result"></p>
    </div>
    
    <div class="fight">
        <div id="fight" style="display: flex; align-items: center; justify-content: center; gap: 1.5rem; font-size: 3rem; min-height: 5rem;">
            <span id="player-icon" style="opacity: 0.2;">🗿</span>
            <span style="font-size: 1.2rem; font-weight: 500; color: #888;">VS</span>
            <span id="computer-icon" style="opacity: 0.2;">❓</span>
        </div>
    </div>
<p id="result"></p>

    <div class="footer">
        <p>contribution :</p>
        <p>Jean--Daudé Louka</p>
        <p>Guilhem Evann</p>
        <p>Mateus Quentin</p>
        <p>Cabezas Luigi</p>
    </div>
<script>
    async function play(playerChoice) {
        const response = await fetch('play.sh', {
            method: 'POST',
            body: playerChoice
        });
        const text = await response.text();
        const data = JSON.parse(text);

        // Update the VS display
        document.getElementById('player-icon').textContent = playerChoice;
        document.getElementById('player-icon').style.opacity = '1';
        document.getElementById('computer-icon').textContent = data.computerChoice;
        document.getElementById('computer-icon').style.opacity = '1';

        // Result message
        const msg = data.result === 'tie' ? "Égalité !" : data.result === 'win' ? '✔️ Vous gagnez !' : '❌ Vous perdez !';
        document.getElementById('result').textContent = msg;
    }
</script>
</body>
</html>
